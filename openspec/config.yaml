schema: spec-driven

context: |
  Mini News Portal (MVP)
  Tech stack: NuxtJS 3, Vercel (serverless free tier), Supabase (free tier)
  Language: TypeScript, Vue 3 Composition API
  Rendering: SSR for public pages, SPA for admin
  Database: Supabase PostgreSQL (via connection pooler)
  Auth: Supabase Auth (email/password + Google OAuth), admin email allowlist
  Storage: Supabase Storage (public bucket for thumbnails)
  Architecture: Layered - Transport (Nuxt server/api), Service (server/services), Persistence (Supabase)
  Constraints: Vercel free plan (10s timeout, 100GB bandwidth), Supabase free plan (500MB DB, 1GB storage)
  Third-party credentials: Use placeholders (SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, etc.)

rules:
  tasks:
    - Break tasks into small, independently testable chunks
    - Use placeholder values for third-party keys/URLs
    - Each task should be completable without user interruption
